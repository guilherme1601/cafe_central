<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A Café Central oferece a melhor experiência da região.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <title>Café Central - A melhor cafeteria da região</title>
</head>

<body>

    <header class="topo">

        <div class="logo">
            <a href="../index.html">Café<span>Central</span></a>
        </div>

        <nav class="menu">
            <a href="../index.html">Início</a>
            <a href="../pages/sobre.html">Sobre</a>
            <a href="../pages/contato.html">Contato</a>
        </nav>
    </header>

    <main class="container pagina-auth">

        <section class="bloco-auth">

            <h1>Login</h1>

            <p class="texto-auth">
                Entre com seu e-mail e senha para acessar o cardápio
            </p>

            <form class="form-auth" id="formLogin">

                <label for="emailLogin">E-mail</label>
                <input 
                    type="email" 
                    id="emailLogin" 
                    placeholder="Digite seu e-mail" 
                    required>

                <label for="senhaLogin">Senha</label>
                <input 
                    type="password" 
                    id="senhaLogin" 
                    placeholder="Digite sua senha" 
                    required>

                <button type="submit" class="btn-primario">Login</button>

                <p id="mensagemLogin" class="mensagem-auth"></p>
            </form>

            <p class="link-auth">
                Ainda não possui uma conta?
                <a href="../pages/cadastro.html">Fazer Cadastro</a>
            </p>

        </section>
    </main>

    <footer class="rodape">
        <p>&copy; 2026 Café Central. Todos os direitos reservados</p>
        <p><a href="../pages/contato.html">Entre em Contato</a></p>
    </footer>

    <script src="../js/auth.js"></script>

</body>
</html>
