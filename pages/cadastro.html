<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="O Café Central é a melhor cafeteria da região">
        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="../css/auth.css">
        <title>Café Central - A melhor cafeteria da região</title>
    </head>

    <body>
        <header class="topo">
            <div class="logo">
                <a href="../index.html">Café<span>Central</span></a>
            </div>
            <nav class="menu">
                <a href="../index.html">Início</a>
                <a href="../pages/sobre.html">Sobre</a>
                <a href="../pages/contato.html">Contato</a>
                <a href="../pages/login.html">Login</a>
            </nav>
        </header>

        <main class="container pagina-auth">

            <section class="bloco-auth">

                <h1>Cadastro</h1>

                <p class="texto-auth">Crie sua conta para acessar o cardápio</p>

                <form class="form-auth" id="formCadastro">

                    <label for="nome">Nome</label>
                    <input type="text" id="nome" placeholder="Digite seu nome" required>

                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail" required>

                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Digite sua senha" required>

                    <button type="submit" class="btn-primario">Cadastrar</button>

                    <p id="mensagem" class="mensagem-auth"></p>
                </form>

                <p class="link-auth">
                    Já possui uma conta?
                    <a href="../pages/login.html">Fazer Login</a>
                </p>

            </section>
        </main>

        <footer class="rodape">
            <p>&copy; 2026 Café Central. Todos os direitos reservados</p>
            <p><a href="../pages/contato.html">Entre em Contato</a></p>
        </footer>

        <script src="../js/auth.js"></script>

    </body>
</html>
